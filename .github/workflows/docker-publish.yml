name: Build & Publish Docker Image

on:
  push:
    branches: [main]
  schedule:
    # Runs daily at 02:00 UTC — pulls fresh Medium blogs then rebuilds
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  sync-blogs:
    name: Sync Medium Blogs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch and update tech blogs from Medium RSS
        run: node .github/scripts/sync-medium-blogs.mjs

      - name: Check for changes
        id: check
        run: |
          git diff --quiet src/data/blogs.ts && echo "changed=false" >> $GITHUB_OUTPUT || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit updated blogs
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/blogs.ts
          git commit -m "chore: sync Medium tech blogs [skip ci]"
          git push

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: sync-blogs
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull the latest commit (may include the blog sync commit above)
          ref: main

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/vedant-portfolio:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/vedant-portfolio:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
